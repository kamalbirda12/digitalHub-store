<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigitalHub Store</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#111}
header{background:#111827;color:white;padding:22px;text-align:center}
header h1{margin:0 0 8px}
.wrap{max-width:1100px;margin:25px auto;padding:0 15px}
.panel{background:white;padding:20px;border-radius:14px;margin-bottom:25px;box-shadow:0 3px 15px #0001}
input,textarea,select{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:8px}
textarea{min-height:90px}
button{border:0;padding:11px 16px;border-radius:8px;background:#111827;color:white;cursor:pointer;margin:5px 3px}
button:hover{opacity:.85}
.secondary{background:#555}
.delete{background:#c62828}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 3px 15px #0001}
.thumb{font-size:55px;text-align:center;padding:25px;background:#eef2ff}
.body{padding:18px}
.tag{font-size:13px;color:#666}
.price{font-size:22px;font-weight:bold;margin:12px 0}
.notice{margin-top:10px;color:#555}
.cart{background:#eef2ff;padding:15px;border-radius:10px;margin-top:15px}
.hidden{display:none}
footer{text-align:center;padding:30px;color:#666}
</style>
</head>

<body>

<header>
<h1>🛍️ DigitalHub Store</h1>
<p>Digital Products for Creators & Learners</p>
</header>

<div class="wrap">

<div class="panel">
<h2>🛒 Your Cart</h2>
<div id="cart">Your cart is empty.</div>
<button onclick="checkout()">Buy Cart Items</button>
</div>

<div class="panel">
<h2>🔐 Seller Admin</h2>

<div id="adminLogin">
<input id="adminPassword" type="password" placeholder="Enter admin password">
<button onclick="adminLogin()">Login</button>
<div id="loginMessage" class="notice"></div>
</div>

<div id="adminPanel" class="hidden">
